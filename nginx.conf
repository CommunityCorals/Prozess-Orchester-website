# Only fixed, non-identifying dimensions are recorded in the funnel log.
map $arg_event $po_event {
  default "";
  ~^(page_view|example_open|example_followup|contact_click|form_start|form_success|form_error)$ $arg_event;
}
map $arg_page $po_page { default other; home home; assistant assistant; paper paper; contact contact; }
map $arg_entry $po_entry { default other; home home; assistant assistant; paper paper; contact contact; }
map $arg_campaign $po_campaign {
  default direct;
  po_krefeld_region_1eur paper;
  po_ki_assistent_krefeld_1eur assistant;
}
map $arg_task $po_task { default none; ~^(vergleich|kundenservice|excel|auftrag|rechnung|andere)$ $arg_task; }
map $time_iso8601 $po_day { "~^(\d{4}-\d{2}-\d{2})" $1; }
log_format po_funnel escape=json '{"time":"$time_iso8601","event":"$po_event","page":"$po_page","entry":"$po_entry","campaign":"$po_campaign","task":"$po_task"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  # Canonical public URLs have no trailing slash. Internal directory resolution
  # serves their pre-rendered index without exposing the container port.
  rewrite ^/prozess-check/?$ /kontakt permanent;
  rewrite ^/ki-arbeitsplatz/?$ /ki-assistent permanent;
  rewrite ^/(.+)/$ /$1 permanent;
  location = /_events {
    if ($request_method != POST) { return 405; }
    if ($po_event = "") { return 400; }
    access_log /var/log/po-events/events-$po_day.jsonl po_funnel;
    add_header Cache-Control "no-store";
    return 204;
  }
  location /campaign/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }
  location / {
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404/index.html;
  location = /404/index.html { internal; }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
